<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Staff Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEEAE8;--surface:#FBF9F8;--ink:#141210;--muted:#6F6862;--line:#DDD6D1;--accent:#F27A1A;--btn:#C9520A;--red:#B3261E}
@media (prefers-color-scheme: dark){:root{--bg:#151311;--surface:#221E1B;--ink:#F5F0EB;--muted:#B3AAA2;--line:#3A332E;--accent:#FF8A2B;--btn:#E8650C;--red:#F2867D}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 Poppins,system-ui,sans-serif;padding:16px}
form{background:var(--surface);border-radius:28px;padding:32px;width:min(380px,100%);box-shadow:0 22px 40px -22px rgba(0,0,0,.4)}
h1{font-family:"Playfair Display",serif;margin:0 0 4px;font-size:1.8rem}
h1 em{font-style:normal;color:var(--accent)}
p{color:var(--muted);margin:0 0 22px}
label{display:block;font-weight:500;margin-bottom:6px}
input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:13px 18px;font:inherit}
.back{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.back:hover{border-color:var(--accent)}
button{margin-top:16px;width:100%;border:0;border-radius:999px;padding:13px;background:var(--btn);color:#fff;font:600 1rem Poppins,sans-serif;cursor:pointer}
.err{color:var(--red);min-height:1.5em;margin-top:10px;font-size:.9rem}
</style>
</head>
<body>
<form id="f">
  <h1>Ganesh <em>Brothers</em></h1>
  <p>Staff dashboard — sign in to see orders.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button>Sign in</button>
  <div class="err" id="err" role="alert"></div>
  <a class="back" href="/">← Back to store</a>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const r = await fetch('/staff/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) location.reload(); else err.textContent = (await r.json()).error || 'Sign in failed.';
  } catch { err.textContent = 'Could not reach the server.'; }
});
</script>
</body>
</html>
